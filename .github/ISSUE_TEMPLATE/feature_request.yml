name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description:
        The change you have in mind, and any alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does it touch the sandbox boundary?
      description: >
        The jailer, network rules, proxy, cc-launch, guest image, the API key,
        or what leaves the machine.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
